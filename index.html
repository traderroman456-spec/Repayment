<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/><title>UPI Payment</title><style>*{box-sizing:border-box}body{font-family:Arial,sans-serif;background:#0f172a;color:#f8fafc;display:flex;justify-content:center;align-items:center;min-height:100vh;margin:0;padding:20px}.card{background:#1e293b;padding:24px;border-radius:14px;max-width:420px;width:100%;text-align:center}.btn{display:block;margin-top:14px;padding:12px 20px;background:#22c55e;color:#052e16;font-weight:bold;text-decoration:none;border:none;border-radius:8px;cursor:pointer;width:100%;font-size:15px}.btn-sec{background:#334155;color:#f8fafc;margin-top:10px}.info{font-size:14px;color:#cbd5e1;margin-top:8px;word-break:break-all}.box{margin-top:18px;padding-top:16px;border-top:1px solid #334155;text-align:left;display:none}.box.active{display:block}label{display:block;font-size:13px;color:#94a3b8;margin-top:10px;margin-bottom:4px}input{width:100%;padding:10px;border-radius:8px;border:1px solid #475569;background:#0f172a;color:#f8fafc;font-size:14px}.msg{margin-top:10px;font-size:13px;color:#4ade80;text-align:center}.top{display:flex;justify-content:flex-end}.link{background:none;border:none;color:#94a3b8;font-size:12px;cursor:pointer;text-decoration:underline}.share-box{margin-top:16px;padding:12px;background:#0f172a;border:1px solid #334155;border-radius:10px;text-align:left;display:none}.share-box.active{display:block}</style></head><body><div class="card"><div class="top"><button type="button" class="link" onclick="toggleAdmin()"><span style="display:none;">Admin Login</span></button></div><h2 id="title">UPI Payment</h2><p id="details" class="info"></p><a id="payBtn" class="btn" href="#">Pay Now</a><div id="shareBox" class="share-box"><label style="margin-top:0">Customer Payment Link</label><input type="text" id="shareUrl" readonly/><button type="button" class="btn btn-sec" onclick="copyShareUrl()">Copy Customer Link</button><p id="copyMsg" class="msg"></p></div><div id="loginBox" class="box"><label>Admin PIN</label><input type="password" id="pinInput" placeholder="Enter PIN"/><button type="button" class="btn" onclick="login()">Login</button><p id="errMsg" class="info" style="color:#f87171"></p></div><div id="panel" class="box"><h3 style="margin:0 0 8px 0">Update Payment Details</h3><label>UPI ID</label><input type="text" id="paInput" placeholder="example@upi"/><label>Name</label><input type="text" id="pnInput" placeholder="Your Name"/><label>Amount</label><input type="text" id="amInput" placeholder="100.00"/><label>Note</label><input type="text" id="tnInput" placeholder="Payment"/><button type="button" class="btn" onclick="saveCfg()">Save Changes</button><button type="button" class="btn btn-sec" onclick="resetCfg()">Reset Default</button><button type="button" class="btn btn-sec" onclick="logout()">Logout</button><p id="saveMsg" class="msg"></p></div></div><script>const ADMIN_PIN="1234",KEY="upi_cfg_v1",LIVE_BASE="https://heartfelt-pegasus-3a0c0e.netlify.app/",DEF={pa:"yourname@upi",pn:"Your Name",am:"100.00",cu:"INR",tn:"Payment"};let isAdminLoggedIn=false;function getUrlCfg(){const q=new URLSearchParams(window.location.search),o={};if(q.get("pa"))o.pa=q.get("pa");if(q.get("pn"))o.pn=q.get("pn");if(q.get("am"))o.am=q.get("am");if(q.get("tn"))o.tn=q.get("tn");return o}function getCfg(){try{const saved=JSON.parse(localStorage.getItem(KEY))||{};return Object.assign({},DEF,saved,getUrlCfg())}catch(e){return Object.assign({},DEF,getUrlCfg())}}function buildShareLink(c){const base=window.location.protocol.startsWith("http")?window.location.href.split("?")[0]:LIVE_BASE,p=new URLSearchParams({pa:c.pa.trim(),pn:c.pn.trim(),tn:(c.tn||"Payment").trim()});if(c.am&&c.am.trim()!=="")p.set("am",c.am.trim());return base+"?"+p.toString()}function render(){const c=getCfg(),cleanAm=(c.am||"").replace(/,/g,"").trim(),p=new URLSearchParams({pa:c.pa.trim(),pn:c.pn.trim(),cu:c.cu||"INR",tn:(c.tn||"Payment").trim()});if(cleanAm!=="")p.set("am",cleanAm);const u="upi://pay?"+p.toString();document.getElementById("title").textContent=c.pn||"UPI Payment";document.getElementById("details").textContent="UPI ID: "+c.pa+(cleanAm?" | Amount: "+cleanAm:"");document.getElementById("payBtn").href=u;paInput.value=c.pa||"";pnInput.value=c.pn||"";amInput.value=cleanAm;tnInput.value=c.tn||"";const sb=document.getElementById("shareBox");if(isAdminLoggedIn&&c.pa&&c.pa!=="yourname@upi"){sb.classList.add("active");document.getElementById("shareUrl").value=buildShareLink(c)}else{sb.classList.remove("active")}}function toggleAdmin(){const p=document.getElementById("panel"),b=document.getElementById("loginBox");errMsg.textContent="";saveMsg.textContent="";if(p.classList.contains("active")){p.classList.remove("active");return}b.classList.toggle("active")}function login(){if(pinInput.value===ADMIN_PIN){isAdminLoggedIn=true;loginBox.classList.remove("active");panel.classList.add("active");pinInput.value="";errMsg.textContent="";render()}else{errMsg.textContent="Wrong PIN!"}}function saveCfg(){const cleanAm=amInput.value.replace(/,/g,"").trim(),upd={pa:paInput.value.trim(),pn:pnInput.value.trim(),am:cleanAm,cu:"INR",tn:tnInput.value.trim()||"Payment"};if(!upd.pa){saveMsg.style.color="#f87171";saveMsg.textContent="UPI ID required.";return}localStorage.setItem(KEY,JSON.stringify(upd));saveMsg.style.color="#4ade80";saveMsg.textContent="Saved! Customer link ready below.";render()}function resetCfg(){localStorage.removeItem(KEY);saveMsg.style.color="#4ade80";saveMsg.textContent="Default restored.";render()}function logout(){isAdminLoggedIn=false;panel.classList.remove("active");saveMsg.textContent="";render()}function copyShareUrl(){const inp=document.getElementById("shareUrl");inp.select();inp.setSelectionRange(0,99999);navigator.clipboard?navigator.clipboard.writeText(inp.value).then(()=>{copyMsg.textContent="Copied!"}):document.execCommand("copy")&&(copyMsg.textContent="Copied!")}render();</script></body></html>
