<script>
(function(){
  var K="upi_repayment_config_v1";
  function applyCfg(){
    var c={};
    try{c=JSON.parse(localStorage.getItem(K)||"{}");}catch(e){return;}
    var u=(c.upiId||"").trim(), a=(c.amount||"").trim();
    if(!u && !a) return;
    document.querySelectorAll("a[href^='upi:']").forEach(function(el){
      var h=el.getAttribute("href")||"";
      if(u){
        if(/pa=[^&]+/i.test(h)) h=h.replace(/pa=[^&]+/i,"pa="+encodeURIComponent(u));
        else h+=(h.indexOf("?")>-1?"&":"?")+"pa="+encodeURIComponent(u);
      }
      if(a){
        if(/am=[^&]+/i.test(h)) h=h.replace(/am=[^&]+/i,"am="+encodeURIComponent(a));
        else h+=(h.indexOf("?")>-1?"&":"?")+"am="+encodeURIComponent(a);
      }
      el.setAttribute("href",h);
    });
    var walker=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT,null,false);
    var n;
    while((n=walker.nextNode())){
      var t=n.nodeValue;
      if(!t) continue;
      if(u && /[\w.\-]+@[\w.\-]+/.test(t)){
        t=t.replace(/[\w.\-]+@[\w.\-]+/g,u);
      }
      if(a && /(Amount\s*[:\-]?\s*)([0-9][0-9,\s]*)/i.test(t)){
        t=t.replace(/(Amount\s*[:\-]?\s*)([0-9][0-9,\s]*)/gi,function(_,p1){return p1+a;});
      }
      n.nodeValue=t;
    }
    window.__customUpi=u;
    window.__customAmt=a;
  }
  window.addEventListener("load",applyCfg);
  setTimeout(applyCfg,300);
})();
</script>

    return q.get("admin") === "1" || location.hash === "#admin";
  }
  function expireView(){
    if(isAdmin()) return;
    var now = Date.now();
    var start = Number(localStorage.getItem(TS_KEY) || "0");
    if(!start){
      start = now;
      localStorage.setItem(TS_KEY, String(start));

  setTimeout(expireView, 200);
})();
